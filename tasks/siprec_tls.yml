---
# --------------------------------------------------
# Certificate and key for SIP over TLS on the SIPREC interface.
#
# When neither file exists, create a self-signed certificate. Never overwrite
# an existing file: operators can provide their own certificate and key.
# When the files that miarec.ini names don't exist, the recorder creates a
# self-signed certificate of its own at startup, which clients can't know
# before the recorder starts.
# --------------------------------------------------
- name: Check whether the SIPREC TLS certificate and key exist
  stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ miarec_siprec_tls_cert_file }}"
    - "{{ miarec_siprec_tls_key_file }}"
  register: _siprec_tls_files

- name: Fail if only one of the SIPREC TLS certificate and key exists
  fail:
    msg: >-
      Only one of the SIPREC TLS certificate '{{ miarec_siprec_tls_cert_file }}'
      and key '{{ miarec_siprec_tls_key_file }}' exists, so the role can't create
      a matching pair without overwriting a file. Provide both files, or remove
      the one that exists to let the role create a self-signed certificate.
  when: _siprec_tls_files.results | selectattr('stat.exists') | list | length == 1

- name: Create a self-signed SIPREC TLS certificate
  when: _siprec_tls_files.results | selectattr('stat.exists') | list | length == 0
  block:
    - name: Check whether the directories of the SIPREC TLS certificate and key exist
      stat:
        path: "{{ item }}"
        get_checksum: false
      loop: "{{ [miarec_siprec_tls_cert_file, miarec_siprec_tls_key_file] | map('dirname') | unique | list }}"
      register: _siprec_tls_dirs

    - name: Create the missing directories of the SIPREC TLS certificate and key
      file:
        path: "{{ item.item }}"
        state: directory
        owner: root
        group: "{{ miarec_bin_group }}"
        mode: "u=rwx,g=rx,o="
      loop: "{{ _siprec_tls_dirs.results | rejectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    # openssl writes the key before it fails, for example, on a common name
    # longer than 64 characters. Create both files in a temporary directory,
    # so that a failure leaves no single file in place.
    - name: Create a temporary directory for the SIPREC TLS certificate
      tempfile:
        state: directory
        suffix: .siprec-tls
      register: _siprec_tls_tmpdir

    - name: Create the SIPREC TLS key and self-signed certificate
      command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -sha256
          - -days
          - "{{ miarec_siprec_tls_cert_days }}"
          - -subj
          - "/CN={{ miarec_siprec_tls_cert_common_name }}"
          - -keyout
          - "{{ _siprec_tls_tmpdir.path }}/key.pem"
          - -out
          - "{{ _siprec_tls_tmpdir.path }}/cert.pem"
          - -config
          - /dev/stdin
        stdin: |
          [req]
          distinguished_name = req_distinguished_name
          x509_extensions = v3_siprec
          [req_distinguished_name]
          [v3_siprec]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature,keyEncipherment
          extendedKeyUsage = serverAuth
          subjectKeyIdentifier = hash
          subjectAltName = DNS:{{ miarec_siprec_tls_cert_common_name }}
        creates: "{{ _siprec_tls_tmpdir.path }}/cert.pem"

    # force: false never overwrites a file that appeared after the check above.
    - name: Install the SIPREC TLS key
      copy:
        src: "{{ _siprec_tls_tmpdir.path }}/key.pem"
        dest: "{{ miarec_siprec_tls_key_file }}"
        remote_src: true
        force: false
        owner: root
        group: "{{ miarec_bin_group }}"
        mode: "u=rw,g=r,o="
      notify: Restart miarec

    - name: Install the SIPREC TLS certificate
      copy:
        src: "{{ _siprec_tls_tmpdir.path }}/cert.pem"
        dest: "{{ miarec_siprec_tls_cert_file }}"
        remote_src: true
        force: false
        owner: root
        group: "{{ miarec_bin_group }}"
        mode: "u=rw,g=r,o=r"
      notify: Restart miarec

  always:
    - name: Remove the temporary directory of the SIPREC TLS certificate
      file:
        path: "{{ _siprec_tls_tmpdir.path }}"
        state: absent
      when: _siprec_tls_tmpdir.path is defined
