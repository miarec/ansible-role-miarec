---
- name: "Gather os specific variables ({{ ansible_facts['distribution'] }} - {{ ansible_facts['distribution_major_version'] }})"
  include_vars: "{{ item }}"
  with_first_found:
    - "../vars/{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
    - "../vars/{{ ansible_facts['distribution'] }}.yml"
    - "../vars/{{ ansible_facts['os_family'] }}.yml"

# ---------------------------------------------
# Install dependencies
# ---------------------------------------------
- name: Install dependencies
  import_tasks: dependencies.yml
  become: true

# --------------------------------------------------
# Create user/group
# --------------------------------------------------
- name: "Add miarec group '{{ miarec_bin_group }}'"
  group:
    name: "{{ miarec_bin_group }}"
    state: present
  when: miarec_bin_group != 'root'
  become: true

- name: "Add miarec user '{{ miarec_bin_user }}'"
  user:
    name: "{{ miarec_bin_user }}"
    group: "{{ miarec_bin_group }}"
    comment: "MiaRec"
    shell: /bin/false
    system: true
  when: miarec_bin_user != 'root'
  become: true

# --------------------------------------------------
# Upload TLS files (optional)
# A file is uploaded when its *_src variable is set. The private keys get
# the group created above. The role sets permissions only on the files it
# uploads; a file that is already on the host is left as is.
# --------------------------------------------------
- name: Upload TLS files
  import_tasks: tls_upload.yml
  when: miarec_db_use_ssl | bool or miarec_redis_use_ssl | bool or miarec_siprec_tls_port | int != 0
  become: true

# --------------------------------------------------
# Verify the recorder's user can read the TLS files
# Runs after the user and group exist and before the release is
# unpacked, so a failure leaves the host untouched.
# --------------------------------------------------
- name: Verify the TLS files are readable
  import_tasks: tls_verify.yml
  when: miarec_db_use_ssl | bool or miarec_redis_use_ssl | bool or miarec_siprec_tls_port | int != 0
  become: true

# --------------------------------------------------
# Initialize the installation/upgrade process
# --------------------------------------------------
- name: Initialize the deploy root and gather facts
  deploy_helper:
    path: "{{ miarec_install_dir }}"
    release: "{{ miarec_version }}"
    mode: u=rwX,g=rX,o=rX
  become: true

# --------------------------------------------------
# Install/upgrade 'miarec' app files
# --------------------------------------------------
- name: Install miarec
  import_tasks: install.yml
  become: true

# --------------------------------------------------
# Cleanup old and unfinished releases
# --------------------------------------------------
- name: Cleanup old releases
  deploy_helper:
    path: "{{ miarec_install_dir }}"
    release: '{{ ansible_facts["deploy_helper"]["new_release"] }}'
    state: finalize
    keep_releases: 10
  notify:
    - Restart miarec
  become: true


# --------------------------------------------------
# Create SFTP user
# --------------------------------------------------
- name: Create SFTP user
  import_tasks: sftpuser.yml
  when: miarec_sftp_create_user|bool
  become: true
