---
# Renew the recorder's SIPREC TLS certificate on the control machine, as an
# operator does before it expires, and run the role again. The role must upload
# the new certificate and key, and restart the recorder. The verify step
# checks that the recorder presents the renewed certificate
# (tests/test_siprec_tls.py).

- name: Renew the recorder's SIPREC TLS certificate on the control machine
  hosts: all
  become: true

  vars:
    tls_src_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls"

  tasks:
    - name: Keep the first certificate of the recorder for the verify step
      copy:
        src: "{{ tls_src_dir }}/siprec/recorder.crt"
        dest: "{{ tls_src_dir }}/siprec/recorder-first.crt"
        mode: "0644"
      delegate_to: localhost
      become: false

    # The CA of the recorder's certificate stayed on the host (see
    # tasks/siprec_certificates.yml), so the host signs the renewed one too.
    - name: Create a temporary directory for the renewed certificate
      tempfile:
        state: directory
        suffix: .siprec-renewed
      register: _siprec_renewed_dir

    - name: Create the renewed certificate and key of the recorder
      include_tasks: tasks/siprec_recorder_certificate.yml
      vars:
        siprec_recorder_dir: "{{ _siprec_renewed_dir.path }}"

    - name: Fetch the renewed certificate and key to the control machine
      fetch:
        src: "{{ _siprec_renewed_dir.path }}/{{ item }}"
        dest: "{{ tls_src_dir }}/siprec/"
        flat: true
      loop: [recorder.crt, recorder.key]

    - name: Remove the renewed certificate and key from the host
      file:
        path: "{{ _siprec_renewed_dir.path }}"
        state: absent

    - name: Read the state of the recorder's service before the role runs
      systemd:
        name: miarec
      register: _siprec_service_before

    - name: Remember the main PID of the recorder
      set_fact:
        siprec_pid_before_renewal: "{{ _siprec_service_before.status.MainPID }}"

- name: Run the role with the renewed certificate
  import_playbook: converge.yml

- name: Check that the role uploaded the renewed certificate and restarted the recorder
  hosts: all
  become: true

  vars:
    tls_src_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tls"

  tasks:
    - name: Read the checksums of the renewed certificate and key on the control machine
      stat:
        path: "{{ tls_src_dir }}/siprec/{{ item }}"
      loop: [recorder.crt, recorder.key]
      register: _siprec_renewed_src
      delegate_to: localhost
      become: false

    - name: Read the checksums of the certificate and key on the host
      stat:
        path: "/etc/miarec/siprec-tls/{{ item }}"
      loop: [recorder.crt, recorder.key]
      register: _siprec_renewed_host

    - name: Check that the host has the renewed certificate and key
      assert:
        that:
          - _siprec_renewed_host.results | map(attribute='stat.checksum') | list == _siprec_renewed_src.results | map(attribute='stat.checksum') | list
        fail_msg: "The role didn't upload the renewed SIPREC TLS certificate and key."

    - name: Read the state of the recorder's service after the role ran
      systemd:
        name: miarec
      register: _siprec_service_after

    - name: Check that the role restarted the recorder
      assert:
        that:
          - _siprec_service_after.status.MainPID | int != 0
          - _siprec_service_after.status.MainPID != siprec_pid_before_renewal
        fail_msg: >-
          The role didn't restart the recorder after it uploaded the renewed
          certificate: the main PID is still {{ _siprec_service_after.status.MainPID }}.
