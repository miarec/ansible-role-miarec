---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - set_fact:
        miarec_version: "{{ lookup('env', 'MIAREC_VERSION') }}"

        # MiaRec group configuration (required for TLS certificate access)
        miarec_bin_group: "{{ lookup('env', 'MIAREC_BIN_GROUP') }}"
        miarec_bin_user: "{{ lookup('env', 'MIAREC_BIN_USER') }}"

    - name: Update apt cache | Debian
      apt:
        update_cache: true
        cache_valid_time: 600
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

  roles:
    - role: "{{ playbook_dir }}/../.." # noqa: role-name[path]
      vars:
        # PostgreSQL and Redis each have their own PKI and their own directory.
        # The role uploads the files from the control machine (see prepare.yml).
        # PostgreSQL TLS configuration
        miarec_db_use_ssl: true
        miarec_db_tls_ca_file: /etc/miarec/tls/postgresql/ca.crt
        miarec_db_tls_cert_file: /etc/miarec/tls/postgresql/client.crt
        miarec_db_tls_key_file: /etc/miarec/tls/postgresql/client.key
        miarec_db_tls_check_hostname: false
        miarec_db_tls_ca_file_src: "{{ tls_src_dir }}/postgresql/ca.crt"
        miarec_db_tls_cert_file_src: "{{ tls_src_dir }}/postgresql/client.crt"
        miarec_db_tls_key_file_src: "{{ tls_src_dir }}/postgresql/client.key"
        # Redis TLS configuration
        miarec_redis_use_ssl: true
        miarec_redis_tls_ca_file: /etc/miarec/tls/redis/ca.crt
        miarec_redis_tls_cert_file: /etc/miarec/tls/redis/client.crt
        miarec_redis_tls_key_file: /etc/miarec/tls/redis/client.key
        miarec_redis_tls_check_hostname: false
        miarec_redis_tls_ca_file_src: "{{ tls_src_dir }}/redis/ca.crt"
        miarec_redis_tls_cert_file_src: "{{ tls_src_dir }}/redis/client.crt"
        miarec_redis_tls_key_file_src: "{{ tls_src_dir }}/redis/client.key"
