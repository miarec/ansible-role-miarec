---
# Certificates for SIP over TLS on the SIPREC interface.
#
# SIPREC-CA stands for the CA of a deployment: it signs the recorder's
# certificate, which the clients verify, and the clients' certificates, which
# the recorder verifies. This file creates:
#   - SIPREC-CA, in /etc/miarec/tls, where it stays: side_effect.yml signs the
#     renewed certificate of the recorder with it.
#   - The recorder's certificate and key (tasks/siprec_recorder_certificate.yml),
#     which prepare.yml fetches to the control machine with the CA certificate,
#     so that the role uploads them.
#   - A client certificate that SIPREC-CA signs, for the tests.
# The tests use the client certificate of certificates.yml, which Test-CA
# signs, as the certificate of a client that the recorder must refuse.

- name: SIPREC | Generate the key of SIPREC-CA
  command: openssl genrsa -out /etc/miarec/tls/siprec-ca.key 2048
  args:
    creates: /etc/miarec/tls/siprec-ca.key

- name: SIPREC | Generate the certificate of SIPREC-CA
  command: >
    openssl req -x509 -new -nodes
    -key /etc/miarec/tls/siprec-ca.key
    -sha256 -days 365
    -out /etc/miarec/tls/siprec-ca.crt
    -subj "/CN=SIPREC-CA"
  args:
    creates: /etc/miarec/tls/siprec-ca.crt

- name: SIPREC | Create the recorder's certificate and key
  include_tasks: siprec_recorder_certificate.yml
  vars:
    siprec_recorder_dir: /etc/miarec/tls/siprec-recorder

- name: SIPREC | Generate the key of the SIPREC client
  command: openssl genrsa -out /etc/miarec/tls/siprec-client.key 2048
  args:
    creates: /etc/miarec/tls/siprec-client.key

- name: SIPREC | Create the certificate config of the SIPREC client
  copy:
    content: |
      [req]
      distinguished_name = req_distinguished_name
      req_extensions = v3_req
      prompt = no

      [req_distinguished_name]
      CN = siprec-client

      [v3_req]
      keyUsage = digitalSignature
      extendedKeyUsage = clientAuth
    dest: /etc/miarec/tls/siprec-client.cnf
    mode: "0644"

- name: SIPREC | Generate the CSR of the SIPREC client
  command: >
    openssl req -new
    -key /etc/miarec/tls/siprec-client.key
    -out /etc/miarec/tls/siprec-client.csr
    -config /etc/miarec/tls/siprec-client.cnf
  args:
    creates: /etc/miarec/tls/siprec-client.csr

- name: SIPREC | Sign the certificate of the SIPREC client with SIPREC-CA
  command: >
    openssl x509 -req
    -in /etc/miarec/tls/siprec-client.csr
    -CA /etc/miarec/tls/siprec-ca.crt
    -CAkey /etc/miarec/tls/siprec-ca.key
    -CAcreateserial
    -out /etc/miarec/tls/siprec-client.crt
    -days 365 -sha256
    -extensions v3_req
    -extfile /etc/miarec/tls/siprec-client.cnf
  args:
    creates: /etc/miarec/tls/siprec-client.crt
